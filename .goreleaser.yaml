version: 2
project_name: kubectl-env-diff
before:
  hooks:
    - go mod tidy
builds:
  - id: kubectl-env_diff
    binary: kubectl-env_diff
    main: ./cmd/kubectl-env_diff
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}
archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
